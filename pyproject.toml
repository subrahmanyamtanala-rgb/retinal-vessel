[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "catnet"
version = "0.1.0"
description = "Context-Adaptive Transformers for Retinal Vessel Segmentation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24", "pillow>=9.0", "scipy>=1.10", "scikit-image>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["catnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
